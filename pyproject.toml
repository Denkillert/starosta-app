[project]
name = "starosta-app"
version = "0.1.0"
description = "Неофициальный помощник старосты: расписание ПолесГУ, журнал, документы"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
ignore = ["RUF012"]
